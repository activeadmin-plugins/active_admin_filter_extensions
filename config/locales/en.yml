# The gem's violation messages. Override any of them in your application's locale files
# under the same keys; `message:` on a filter overrides per filter.
en:
  active_admin_filter_extensions:
    invalid: "%{filter} filter has an invalid value."
    range_invalid: "%{filter} filter has an invalid date range value."
    range_too_wide: "%{filter} filter allows a maximum date range of %{limit} days."
    before_floor: "%{filter} filter cannot start before %{floor}."
