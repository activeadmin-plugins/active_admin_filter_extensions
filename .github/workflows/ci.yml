name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }} / AA ${{ matrix.activeadmin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Rails 7.2 reached end of life on 2026-08-09, so the floor is 8.0. Ruby 3.2 went EOL
        # on 2026-03-31, so the floor there is 3.3 (security-only until 2027-03-31).
        ruby: ['3.3', '3.4', '4.0']
        rails: ['8.0.0', '8.1.0']
        activeadmin: ['3.5.0']
    env:
      RAILS: ${{ matrix.rails }}
      AA: ${{ matrix.activeadmin }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # spec/rails_helper.rb would do this on its own, but running it as a step of its own keeps
      # a failure in app generation from being reported as a failure in the first example.
      - name: Generate the sample app
        run: bundle exec rake setup

      # The Clear Filters example drives a real browser through cuprite; ubuntu-latest ships
      # Chrome, so there is nothing to install.
      - name: Run tests
        run: bundle exec rake spec
